; ESP32-C3 桌面小时钟 (ESP-IDF 框架)
; 硬件沿用 14790897/gallery-pro 的 ST7789 240x240 配置
;   引脚与面板参数取自其 env:airm2m_core_esp32c3_240x240
;
; 依赖的四个库未纳入版本库（合计约 158MB），克隆后需自行下载解压到 lib/：
;   lib/LovyanGFX           https://github.com/lovyan03/LovyanGFX        tag 1.2.31
;   lib/AnimatedGIF         https://github.com/bitbank2/AnimatedGIF      tag 2.2.0
;   lib/esp_littlefs        https://github.com/joltwallet/esp_littlefs   tag v1.22.3
;   lib/esp_button          https://github.com/espressif/esp-iot-solution
;                           （只取 components/button，且只需 iot_button.c 与 button_gpio.c）
; 此外 lib/LovyanGFX 必须包含其 src/lgfx/Fonts/ 下的 efont 与 GFXFF 字体，
; 且 lib/esp_littlefs 需补上其 git 子模块 src/littlefs/（littlefs-project/littlefs）。
;
; 以下几处是对 vendored 库的本地改动，重新下载后需重做：
;   1. lib/LovyanGFX/library.json    加 srcFilter 排除未编译的 ja/kr/tw 字体（省 91MB 构建时间）
;   2. lib/AnimatedGIF/              加 ESP-IDF 分支（上游只覆盖 Pico/Linux/macOS），
;                                    并补 millis()/delay()；library.json 排除 .S 汇编
;   3. lib/esp_littlefs/library.json 排除 littlefs_bdl.c（仅 IDF 6+ 需要）与 littlefs_sdmmc.c
;   4. lib/esp_button/               加 library.json 声明 espidf 支持

[platformio]
default_envs = esp32c3-clock

[env:esp32c3-clock]
platform = espressif32
board = airm2m_core_esp32c3
framework = espidf
monitor_speed = 115200
upload_protocol = esptool
; 默认分区表 app 区仅 1MB，装不下带中文点阵字库的固件，改用自定义的表
; （app 2MB + storage 约 1.9MB，后者放按 BOOT 播放的 GIF）
board_build.partitions = partitions.csv
; GIF 走文件系统。用 LittleFS（与 gallery-pro 一致，也是本平台默认值）；
; ESP-IDF 不自带 littlefs 组件，挂载靠 vendored 的 lib/esp_littlefs
board_build.filesystem = littlefs

; 引脚按用户实测接线（gallery-pro 的 env 原值为 DC=6/CS=7/RST=10，
; 实测是这三个脚轮换：6→CS、7→RST、10→DC，SCLK/MOSI 一致）：
;   SCL=GPIO2 / SDA=GPIO3 / CS=GPIO6 / DC=GPIO10 / RST=GPIO7
build_flags =
    -DTFT_SCLK=2
    -DTFT_MOSI=3
    -DTFT_MISO=-1
    -DTFT_CS=6
    -DTFT_DC=10
    -DTFT_RST=7
    -DTFT_BL=11
    -DSCREEN_WIDTH=240
    -DSCREEN_HEIGHT=240
    -DSCREEN_ROTATION=1
    ; esp_littlefs 自带的 Kconfig 不会被 PlatformIO 处理，数值型配置项得手动给。
    ; 取值必须与平台的镜像生成器一致（见 platforms/espressif32/builder/main.py
    ; 里 littlefs-python 那段，它照的是 Arduino 的参数），否则挂载失败。
    -DCONFIG_LITTLEFS_MAX_PARTITIONS=3
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -DCONFIG_LITTLEFS_OBJ_NAME_LEN=64
    -DCONFIG_LITTLEFS_READ_SIZE=1
    -DCONFIG_LITTLEFS_WRITE_SIZE=1
    -DCONFIG_LITTLEFS_CACHE_SIZE=4096
    -DCONFIG_LITTLEFS_LOOKAHEAD_SIZE=32
    -DCONFIG_LITTLEFS_BLOCK_CYCLES=500
    ; 必须给：lfs_config.h 的 lfs_malloc() 在没有任何 MALLOC_STRATEGY_* 时
    ; 无条件返回 NULL，littlefs 会因拿不到缓存而报 NOMEM(-12)，
    ; 与剩余堆大小无关（实测 231KB 空闲仍失败）
    -DCONFIG_LITTLEFS_MALLOC_STRATEGY_DEFAULT=1
    ; esp_button (iot_button) 的 Kconfig 同样不被 PlatformIO 处理，数值项手动给。
    ; 取值同组件 Kconfig 默认值。
    -DCONFIG_BUTTON_PERIOD_TIME_MS=5
    -DCONFIG_BUTTON_DEBOUNCE_TICKS=2
    -DCONFIG_BUTTON_SHORT_PRESS_TIME_MS=180
    -DCONFIG_BUTTON_LONG_PRESS_TIME_MS=1500
    -DCONFIG_BUTTON_LONG_PRESS_HOLD_SERIAL_TIME_MS=20
    ; 版本宏平时由构建系统从组件清单注入，PlatformIO 不提供，库只用它打一行日志
    -DBUTTON_VER_MAJOR=4
    -DBUTTON_VER_MINOR=2
    -DBUTTON_VER_PATCH=1
